name: Site health check

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC = 07:00 Ghana time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run check
        run: bash check.sh
      - name: Save state for tomorrow's comparison
        if: always()
        run: |
          git config user.name "site-monitor"
          git config user.email "site-monitor@users.noreply.github.com"
          git add state.tsv state-prev.tsv latest.txt history-*.txt
          git diff --cached --quiet || git commit -m "Site check $(date -u +%F)"
          git push
